---
name: 01 Basic Docker Build
# simplest workflow possible

on:
  push:
    branches:
      - all
  pull_request:

jobs:
  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
            
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: rmcdermott111
          password: DockerHub
      
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: rmcdermott111/docker-ci-automation:latest,rmcdermott111/docker-ci-automation:01